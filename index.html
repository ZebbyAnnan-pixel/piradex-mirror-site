<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piradex Embed</title>
    <style>
      :root {
        --bg: #000000;
        --green: #4ab128;
        --green-soft: rgba(74, 177, 40, 0.15);
        --text: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        padding: 14px 18px 8px;
        background: #000;
        border-bottom: 1px solid rgba(74, 177, 40, 0.4);
      }

      .open-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        background: var(--green);
        color: #000;
        text-decoration: none;
        font-weight: 700;
        border-radius: 6px;
      }

      .frame-wrap {
        flex: 1;
        min-height: 0;
        background: #000;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: calc(100vh - 60px);
        border: 0;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="open-link" href="https://piradex.com/" target="_blank" rel="noopener noreferrer">Open original site</a>
    </div>

    <div class="frame-wrap">
      <iframe src="https://piradex.com/" title="Piradex"></iframe>
    </div>
  </body>
</html>
